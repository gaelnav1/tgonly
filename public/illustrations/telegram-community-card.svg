<svg width="620" height="360" viewBox="0 0 620 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#7180A6" flood-opacity=".18"/>
    </filter>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42A5FF"/>
      <stop offset="1" stop-color="#1769FF"/>
    </linearGradient>
  </defs>

  <!-- tilted blue tile -->
  <g transform="translate(277 50) rotate(-8 128 128)" filter="url(#shadow)">
    <rect width="256" height="256" rx="44" fill="#E8EEFF"/>
  </g>

  <!-- Telegram plane, deliberately large and slightly asymmetric -->
  <g transform="translate(340 112) rotate(-7)">
    <path d="M139 8L11 57C2 60 2 67 10 70L45 81L58 121C60 126 61 128 66 128C70 128 72 126 75 123L92 107L127 132C133 136 139 133 141 126L164 17C166 9 160 4 139 8Z" fill="url(#plane)"/>
