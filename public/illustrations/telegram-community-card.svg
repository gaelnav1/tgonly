    <path d="M63 94L92 107L75 123C72 126 70 128 66 128C61 128 60 126 58 121L63 94Z" fill="#3E8BFF"/>
  </g>

  <!-- yellow accent strokes -->
  <rect x="517" y="22" width="10" height="52" rx="5" transform="rotate(18 517 22)" fill="#F4C400"/>
  <rect x="546" y="40" width="10" height="38" rx="5" transform="rotate(40 546 40)" fill="#F4C400"/>

  <!-- handwriting-like decorative line -->
  <path d="M425 292C460 274 490 273 516 286C531 293 542 305 551 319" stroke="#62719B" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
  <path d="M547 309L553 321L540 319" stroke="#62719B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
